<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Brausau">
  <title>Brausau</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <style>
    @font-face { font-family: Skranji; src: url("assets/fonts/Skranji-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    @font-face { font-family: Skranji; src: url("assets/fonts/Skranji-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    :root {
      color-scheme: dark;
      --ink: #101010;
      --paper: #f4efdf;
      --acid: #d5ff00;
      --hot: #ff2f92;
      --ice: #6ff7ff;
      font-family: system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(1.4rem, 5vw, 3.5rem) clamp(1rem, 5vw, 3.5rem) clamp(3.4rem, 7vw, 5rem);
      overflow-x: hidden;
      background: var(--ink);
      color: var(--ink);
    }
    body::before {
      position: fixed;
      inset: -25vmax;
      content: "";
      background-image: radial-gradient(var(--acid) 1.1px, transparent 1.3px);
      background-size: 15px 15px;
      opacity: .24;
      transform: rotate(-9deg);
      animation: drift 36s linear infinite;
      pointer-events: none;
    }
    body::after {
      position: fixed;
      inset: 0;
      content: "";
      background:
        radial-gradient(circle at 12% 18%, rgb(255 47 146 / .8), transparent 30%),
        radial-gradient(circle at 88% 82%, rgb(213 255 0 / .55), transparent 34%),
        radial-gradient(circle at 80% 8%, rgb(111 247 255 / .38), transparent 28%),
        repeating-linear-gradient(115deg, transparent 0 30px, rgb(255 255 255 / .03) 30px 32px);
      pointer-events: none;
    }
    main {
      position: relative;
      z-index: 1;
      width: min(880px, 100%);
      padding: clamp(1.4rem, 4vw, 2.4rem) clamp(1.1rem, 4vw, 2.6rem);
      background: var(--paper);
      border: 4px solid var(--ink);
      box-shadow: 14px 14px 0 var(--hot), 28px 28px 0 var(--acid), 0 0 0 4px var(--ink) inset;
      transform: rotate(-1.1deg);
    }
    main::before {
      position: absolute;
      top: -18px;
      left: 7%;
      width: 108px;
      height: 34px;
      content: "";
      background: rgb(255 47 146 / .8);
      border: 1px solid rgb(16 16 16 / .35);
      box-shadow: 0 2px 0 rgb(16 16 16 / .25);
      transform: rotate(-5deg);
    }
    main::after {
      position: absolute;
      right: 6%;
      bottom: -19px;
      width: 130px;
      height: 36px;
      content: "";
      background: rgb(213 255 0 / .8);
      border: 1px solid rgb(16 16 16 / .35);
      box-shadow: 0 2px 0 rgb(16 16 16 / .25);
      transform: rotate(4deg);
    }
    .poster {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      min-width: 0;
      justify-items: center;
      gap: clamp(1rem, 3vw, 1.5rem);
      padding: clamp(.3rem, 2vw, .8rem) 0 clamp(.4rem, 2vw, .9rem);
    }
    .kicker {
      margin: 0;
      padding: .35rem .85rem .3rem;
      background: var(--ink);
      color: var(--acid);
      font-family: Skranji, Georgia, serif;
      font-size: clamp(.8rem, 2vw, 1.05rem);
      letter-spacing: .14em;
      text-transform: uppercase;
      transform: rotate(1.5deg);
      box-shadow: 4px 4px 0 var(--hot);
    }
    .logo-wrap {
      position: relative;
      width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      padding: clamp(.4rem, 2vw, 1rem);
      isolation: isolate;
    }
    .logo-wrap::before {
      position: absolute;
      inset: -3%;
      z-index: -2;
      content: "";
      background: repeating-conic-gradient(from 0deg, var(--acid) 0deg 8deg, transparent 8deg 16deg);
      border-radius: 50%;
      opacity: .8;
      animation: spin 50s linear infinite;
    }
    .logo-wrap::after {
      position: absolute;
      inset: 5%;
      z-index: -1;
      content: "";
      background: var(--paper);
      border-radius: 50%;
    }
    .logo {
      display: block;
      width: 100%;
      max-width: 620px;
      min-width: 0;
      height: auto;
      filter: contrast(1.1) drop-shadow(0 6px 0 rgb(16 16 16 / .15));
    }
    .viva {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: .7em;
      padding: .55em .9em .5em;
      background: var(--hot);
      color: var(--ink);
      border: 4px solid var(--ink);
      box-shadow: 8px 8px 0 var(--ink), 0 0 0 5px var(--acid);
      font-family: Skranji, Georgia, serif;
      font-size: clamp(1.35rem, 4vw, 2.2rem);
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
      transform: rotate(2deg);
      transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease;
    }
    .viva::before, .viva::after { content: "★"; font-size: .8em; line-height: 0; }
    .viva:hover, .viva:focus-visible {
      background: var(--acid);
      transform: rotate(-3deg) scale(1.07);
      box-shadow: 4px 4px 0 var(--ink), 0 0 0 5px var(--hot);
    }
    .viva:focus-visible { outline: 3px dashed var(--ink); outline-offset: 6px; }
    .sticker {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      width: clamp(64px, 12vw, 96px);
      aspect-ratio: 1;
      background: var(--acid);
      border: 3px solid var(--ink);
      border-radius: 50%;
      color: var(--ink);
      font-family: Skranji, Georgia, serif;
      font-size: clamp(.75rem, 1.8vw, 1rem);
      line-height: .95;
      text-align: center;
      text-transform: uppercase;
      box-shadow: 5px 5px 0 var(--hot);
    }
    .sticker-a { top: -4%; right: -3%; transform: rotate(10deg); }
    .sticker-b { bottom: 2%; left: -4%; background: var(--ice); transform: rotate(-12deg); }
    .hint {
      margin: 0;
      color: #4a4a43;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .ticker {
      position: fixed;
      z-index: 3;
      right: 0;
      bottom: 0;
      left: 0;
      overflow: hidden;
      border-top: 3px solid var(--ink);
      background: var(--acid);
      color: var(--ink);
    }
    .ticker-track { display: flex; width: max-content; animation: marquee 22s linear infinite; }
    .ticker span {
      display: block;
      padding: .38rem 0;
      font-family: Skranji, Georgia, serif;
      font-size: clamp(.78rem, 1.6vw, .98rem);
      letter-spacing: .2em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    @keyframes drift { to { transform: rotate(-9deg) translate3d(15px, 15px, 0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes marquee { to { transform: translateX(-50%); } }
    @media (max-width: 560px) {
      main { transform: none; box-shadow: 8px 8px 0 var(--hot), 16px 16px 0 var(--acid); }
      .sticker { display: none; }
      .logo-wrap::before { inset: -1%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="poster">
      <p class="kicker">Bier ohne Benehmen</p>
      <div class="logo-wrap">
        <span class="sticker sticker-a" aria-hidden="true">Bier?<br>Ja!</span>
        <img class="logo" src="assets/logo_v2.svg" alt="Brausau logo">
        <span class="sticker sticker-b" aria-hidden="true">Prost<br>du!</span>
      </div>
      <a class="viva" href="beers/">Viva!</a>
      <p class="hint">…und jetzt was Richtiges</p>
    </div>
  </main>
  <div class="ticker" aria-hidden="true">
    <div class="ticker-track">
      <span>Brausau ★ Bier ★ Brausau ★ Bier ★ Brausau ★ Bier ★ Brausau ★ Bier ★&nbsp;</span>
      <span>Brausau ★ Bier ★ Brausau ★ Bier ★ Brausau ★ Bier ★ Brausau ★ Bier ★&nbsp;</span>
    </div>
  </div>
</body>
</html>
